[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efd-contribuicoes-recibos"
version = "0.1.0"
description = "Extract structured fields from Brazilian fiscal receipt PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
efd-receipts = "efd_receipts.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
